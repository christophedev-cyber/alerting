<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="16" y="16" width="368" height="808" rx="28"/></clipPath>
  </defs>

  <!-- Phone body -->
  <rect x="4" y="4" width="392" height="832" rx="36" fill="#111827"/>
  <rect x="16" y="16" width="368" height="808" rx="28" fill="#fafafa"/>

  <g clip-path="url(#screen)">
    <!-- App bar -->
    <rect x="16" y="16" width="368" height="64" fill="#37474f"/>
    <text x="36" y="55" fill="#ffffff" font-size="20" font-weight="600">Alerting</text>

    <!-- Intro -->
    <text x="36" y="104" fill="#455a64" font-size="12">Sends an email alert when the phone is no longer</text>
    <text x="36" y="120" fill="#455a64" font-size="12">powered from the mains (220V).</text>

    <!-- Field: Sender email -->
    <text x="36" y="152" fill="#263238" font-size="12" font-weight="600">Sender email (Gmail)</text>
    <rect x="36" y="160" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="182" fill="#263238" font-size="13">home.alert@gmail.com</text>

    <!-- Field: App password -->
    <text x="36" y="216" fill="#263238" font-size="12" font-weight="600">Google app password</text>
    <rect x="36" y="224" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="246" fill="#607d8b" font-size="13">••••••••••••••••</text>

    <!-- Field: Recipients -->
    <text x="36" y="280" fill="#263238" font-size="12" font-weight="600">Recipients (comma separated)</text>
    <rect x="36" y="288" width="328" height="48" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="308" fill="#263238" font-size="13">dad@example.com,</text>
    <text x="46" y="326" fill="#263238" font-size="13">mom@example.com</text>

    <!-- Field: Frequency -->
    <text x="36" y="358" fill="#263238" font-size="12" font-weight="600">Send frequency (minutes)</text>
    <rect x="36" y="366" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="388" fill="#263238" font-size="13">10</text>

    <line x1="36" y1="418" x2="364" y2="418" stroke="#cfd8dc"/>

    <!-- Switch: low battery -->
    <text x="36" y="446" fill="#263238" font-size="13" font-weight="600">Also alert on low battery</text>
    <rect x="322" y="434" width="42" height="20" rx="10" fill="#c62828"/>
    <circle cx="352" cy="444" r="11" fill="#ffffff"/>

    <text x="36" y="478" fill="#263238" font-size="12" font-weight="600">Low-battery threshold (%)</text>
    <rect x="36" y="486" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="508" fill="#263238" font-size="13">20</text>

    <line x1="36" y1="538" x2="364" y2="538" stroke="#cfd8dc"/>

    <!-- SMTP -->
    <text x="36" y="566" fill="#263238" font-size="12" font-weight="600">SMTP server</text>
    <rect x="36" y="574" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="596" fill="#263238" font-size="13">smtp.gmail.com</text>

    <text x="36" y="630" fill="#263238" font-size="12" font-weight="600">SMTP port</text>
    <rect x="36" y="638" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="660" fill="#263238" font-size="13">587</text>

    <!-- Test button -->
    <rect x="36" y="690" width="328" height="40" rx="6" fill="#eceff1" stroke="#90a4ae"/>
    <text x="200" y="715" fill="#37474f" font-size="14" font-weight="600" text-anchor="middle">TEST SEND NOW</text>

    <!-- Start / Stop -->
    <rect x="36" y="740" width="158" height="40" rx="6" fill="#2e7d32"/>
    <text x="115" y="765" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">START</text>
    <rect x="206" y="740" width="158" height="40" rx="6" fill="#b0bec5"/>
    <text x="285" y="765" fill="#263238" font-size="14" font-weight="600" text-anchor="middle">STOP</text>

    <!-- Status -->
    <text x="36" y="806" fill="#1b5e20" font-size="13" font-weight="700">Status: monitoring active</text>
  </g>
</svg>
