<svg xmlns="http://www.w3.org/2000/svg" width="400" height="880" viewBox="0 0 400 880" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="16" y="16" width="368" height="848" rx="28"/></clipPath>
  </defs>

  <rect x="4" y="4" width="392" height="872" rx="36" fill="#111827"/>
  <rect x="16" y="16" width="368" height="848" rx="28" fill="#fafafa"/>

  <g clip-path="url(#screen)">
    <!-- Header: title + status badge -->
    <rect x="16" y="16" width="368" height="60" fill="#37474f"/>
    <text x="36" y="53" fill="#ffffff" font-size="20" font-weight="600">Alerting 1.5</text>
    <text x="364" y="53" fill="#00E676" font-size="16" font-weight="700" text-anchor="end">Active</text>

    <!-- Sender -->
    <text x="36" y="104" fill="#263238" font-size="12" font-weight="600">Sender email (Gmail)</text>
    <rect x="36" y="112" width="328" height="32" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="133" fill="#263238" font-size="13">home.alert@gmail.com</text>

    <!-- Password -->
    <text x="36" y="166" fill="#263238" font-size="12" font-weight="600">Google app password</text>
    <rect x="36" y="174" width="328" height="32" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="195" fill="#607d8b" font-size="13">••••••••••••••••</text>

    <!-- Recipients -->
    <text x="36" y="228" fill="#263238" font-size="12" font-weight="600">Recipients (comma separated)</text>
    <rect x="36" y="236" width="328" height="44" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="256" fill="#263238" font-size="13">dad@example.com,</text>
    <text x="46" y="273" fill="#263238" font-size="13">mom@example.com</text>

    <line x1="36" y1="298" x2="364" y2="298" stroke="#cfd8dc"/>

    <!-- Low battery -->
    <text x="36" y="322" fill="#263238" font-size="13" font-weight="600">Also alert on low battery</text>
    <rect x="322" y="310" width="42" height="20" rx="10" fill="#c62828"/>
    <circle cx="352" cy="320" r="11" fill="#ffffff"/>
    <text x="36" y="352" fill="#263238" font-size="12" font-weight="600">Low-battery threshold (%)</text>
    <rect x="36" y="360" width="328" height="32" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="381" fill="#263238" font-size="13">20</text>

    <line x1="36" y1="410" x2="364" y2="410" stroke="#cfd8dc"/>

    <!-- SMS -->
    <text x="36" y="434" fill="#263238" font-size="13" font-weight="600">Also send SMS alerts</text>
    <rect x="322" y="422" width="42" height="20" rx="10" fill="#2e7d32"/>
    <circle cx="352" cy="432" r="11" fill="#ffffff"/>

    <text x="36" y="464" fill="#263238" font-size="12" font-weight="600">Country</text>
    <rect x="36" y="472" width="328" height="34" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="494" fill="#263238" font-size="13">🇫🇷  France  (+33)</text>
    <text x="352" y="494" fill="#607d8b" font-size="12" text-anchor="end">▾</text>

    <text x="36" y="528" fill="#263238" font-size="12" font-weight="600">Phone number</text>
    <text x="36" y="552" fill="#263238" font-size="14" font-weight="700">+33</text>
    <rect x="70" y="536" width="294" height="32" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="80" y="557" fill="#263238" font-size="13">6 12 34 56 78</text>

    <line x1="36" y1="590" x2="364" y2="590" stroke="#cfd8dc"/>

    <!-- SMTP -->
    <text x="36" y="614" fill="#263238" font-size="12" font-weight="600">SMTP server</text>
    <rect x="36" y="622" width="328" height="32" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="643" fill="#263238" font-size="13">smtp.gmail.com</text>

    <text x="36" y="676" fill="#263238" font-size="12" font-weight="600">SMTP port</text>
    <rect x="36" y="684" width="328" height="32" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="46" y="705" fill="#263238" font-size="13">587</text>

    <!-- Fixed bottom bar -->
    <line x1="16" y1="742" x2="384" y2="742" stroke="#cfd8dc"/>
    <rect x="36" y="754" width="328" height="38" rx="6" fill="#eceff1" stroke="#90a4ae"/>
    <text x="200" y="778" fill="#37474f" font-size="14" font-weight="600" text-anchor="middle">TEST SEND NOW</text>

    <rect x="36" y="800" width="158" height="40" rx="6" fill="#2e7d32"/>
    <text x="115" y="825" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">START</text>
    <rect x="206" y="800" width="158" height="40" rx="6" fill="#c62828"/>
    <text x="285" y="825" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">STOP</text>
  </g>
</svg>
