<svg xmlns="http://www.w3.org/2000/svg" width="400" height="770" viewBox="0 0 400 770" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="16" y="16" width="368" height="738" rx="28"/></clipPath>
  </defs>

  <rect x="4" y="4" width="392" height="762" rx="36" fill="#111827"/>
  <rect x="16" y="16" width="368" height="738" rx="28" fill="#fafafa"/>

  <g clip-path="url(#screen)">
    <!-- Header -->
    <rect x="16" y="16" width="368" height="56" fill="#37474f"/>
    <text x="36" y="51" fill="#ffffff" font-size="19" font-weight="600">Alerting 1.7</text>
    <text x="364" y="51" fill="#00E676" font-size="15" font-weight="700" text-anchor="end">Active</text>

    <!-- ===== Email Alerts ===== -->
    <text x="36" y="94" fill="#00796b" font-size="15" font-weight="700">Email Alerts</text>

    <text x="36" y="114" fill="#455a64" font-size="11">Sender email (Gmail)</text>
    <rect x="36" y="120" width="328" height="26" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="44" y="138" fill="#263238" font-size="12">home.alert@gmail.com</text>

    <text x="36" y="164" fill="#455a64" font-size="11">Google app password</text>
    <rect x="36" y="170" width="328" height="26" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="44" y="188" fill="#607d8b" font-size="12">••••••••••••••••</text>

    <text x="36" y="214" fill="#455a64" font-size="11">Recipients (comma separated)</text>
    <rect x="36" y="220" width="328" height="38" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="44" y="238" fill="#263238" font-size="12">dad@example.com,</text>
    <text x="44" y="252" fill="#263238" font-size="12">mom@example.com</text>

    <text x="36" y="276" fill="#455a64" font-size="11">SMTP server</text>
    <rect x="36" y="282" width="328" height="26" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="44" y="300" fill="#263238" font-size="12">smtp.gmail.com</text>

    <text x="36" y="326" fill="#455a64" font-size="11">SMTP port</text>
    <rect x="36" y="332" width="328" height="26" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="44" y="350" fill="#263238" font-size="12">587</text>

    <line x1="36" y1="372" x2="364" y2="372" stroke="#cfd8dc"/>

    <!-- ===== SMS Alerts ===== -->
    <text x="36" y="394" fill="#00796b" font-size="15" font-weight="700">SMS Alerts</text>

    <text x="36" y="416" fill="#263238" font-size="12" font-weight="600">Also send SMS alerts</text>
    <rect x="322" y="406" width="42" height="18" rx="9" fill="#2e7d32"/>
    <circle cx="352" cy="415" r="10" fill="#ffffff"/>

    <text x="36" y="438" fill="#455a64" font-size="11">Phone number 1</text>
    <rect x="36" y="444" width="70" height="28" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="52" y="463" fill="#263238" font-size="13" font-weight="600">+33</text>
    <text x="96" y="463" fill="#90a4ae" font-size="11">▾</text>
    <rect x="114" y="444" width="250" height="28" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="122" y="463" fill="#263238" font-size="12">6 12 34 56 78</text>

    <text x="36" y="490" fill="#455a64" font-size="11">Phone number 2 (optional)</text>
    <rect x="36" y="496" width="70" height="28" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="52" y="515" fill="#263238" font-size="13" font-weight="600">+32</text>
    <text x="96" y="515" fill="#90a4ae" font-size="11">▾</text>
    <rect x="114" y="496" width="250" height="28" rx="5" fill="#ffffff" stroke="#b0bec5"/>
    <text x="122" y="515" fill="#263238" font-size="12">470 12 34 56</text>

    <line x1="36" y1="540" x2="364" y2="540" stroke="#cfd8dc"/>

    <!-- ===== Low battery ===== -->
    <text x="36" y="562" fill="#00796b" font-size="15" font-weight="700">Low battery</text>
    <text x="36" y="584" fill="#263238" font-size="12" font-weight="600">Also alert on low battery</text>
    <rect x="322" y="574" width="42" height="18" rx="9" fill="#c62828"/>
    <circle cx="332" cy="583" r="10" fill="#ffffff"/>

    <!-- Fixed bottom bar -->
    <line x1="16" y1="622" x2="384" y2="622" stroke="#cfd8dc"/>
    <rect x="36" y="632" width="328" height="34" rx="6" fill="#eceff1" stroke="#90a4ae"/>
    <text x="200" y="654" fill="#37474f" font-size="13" font-weight="600" text-anchor="middle">TEST SEND NOW</text>

    <rect x="36" y="674" width="158" height="38" rx="6" fill="#2e7d32"/>
    <text x="115" y="698" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">START</text>
    <rect x="206" y="674" width="158" height="38" rx="6" fill="#c62828"/>
    <text x="285" y="698" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">STOP</text>
  </g>
</svg>
